
defaults:
  - config
  - _self_


parameterization: apmdm
diffusion: absorbing_state
backbone: dit


data:
  train: 'apmdm'
  valid: 'apmdm'
  tokenizer_name_or_path: 'apmdm'
  wrap: false
  streaming: false
  cache_dir: /workspace/data
  chunk_size: 100000
  
  dataset_path: '/workspace/projects/APMDM/data/apmdm_training_dataset.pkl.gz'
  vocab_cache_path: '/workspace/projects/APMDM/data/vocab_cache.pkl'
  train_ratio: 0.99


model:
  name: apmdm
  type: ddit
  vocab_size: 31
  length: 400
  hidden_size: 128
  n_heads: 2
  n_blocks: 4
  cond_dim: 64
  dropout: 0.1
  scale_by_sigma: true
  tie_word_embeddings: false


apmdm:
  lambda_remask: 1.0
  lambda_expand: 1.0
  lambda_contract: 1.0
  enable_expansion: true
  enable_contraction: true
  remasking_strategy: "random"
  remasking_threshold: 0.5
  expansion_strategy: "threshold"
  expansion_threshold: 0.5
  contraction_strategy: "threshold"
  contraction_threshold: 0.5
  use_precomputed_labels: true

training:
  antithetic_sampling: false
  sampling_eps: 0.001
  ema: 0

loader:
  
  global_batch_size: 256
  eval_global_batch_size: ${.global_batch_size}
  
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: true

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  
  gradient_clip_val: 1.0
  precision: bf16
  num_sanity_val_steps: 1
  
  max_steps: 1000000
  log_every_n_steps: 100
  
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 3000

checkpointing:
  save_dir: 'outputs/apmdm_training'
  save_top_k: 1
  monitor: 'val/loss'
  every_n_train_steps: 10000

optim:
  lr: 1e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  weight_decay: 0.01


lr_scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  num_warmup_steps: 250




sampling:
  predictor: apmdm
  steps: 20
  noise_removal: true
  num_sample_batches: 2
  num_sample_log: 5
  max_steps: 50


noise:
  type: 'loglinear'


seed: 42
time_conditioning: false

eval:
  checkpoint_path: ''
  disable_ema: true
  compute_generative_perplexity: false
  generate_samples: false

wandb:
  project: 'sudoku-apmdm'
  name: sudoku-${now:%Y%m%d_%H%M%S}
  tags: ['apmdm', 'reasoning']
  offline: true
  notes: 'APMDM training'
  group: sudoku-apmdm
