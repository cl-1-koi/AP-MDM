# Paper-faithful AP-MDM Sudoku configuration (arXiv:2510.06190v2).
#
# This file is ADDITIVE.  `train/configs/sudoku.yaml` is the historical config
# that was actually checked in upstream and its meaning is left untouched; the
# two differ and that difference is documented in
# SUDOKU_PAPER_CODE_AUDIT_20260808.md.
#
# Architecture here follows the paper's Appendix "Implementation Details"
# (exp.tex): "For Sudoku, we use 6 layers, 4 attention heads, hidden dimension
# d=256, feed-forward dimension 4d=1024, maximum sequence length 400,
# vocabulary size 31."  Note that this architecture has ~5.4M parameters, not
# the ~1.2M reported in the paper's results table; the historical 4-layer /
# 2-head / width-128 config is the one that lands near 1.2M.  This discrepancy
# is recorded in the audit and is NOT resolved by silently changing either
# config.
#
# Fields the paper does not specify (cond_dim, dropout) take the repository's
# own conventions: cond_dim 128 is what every other checked-in model config
# (tiny/small/medium) uses, and dropout 0.1 matches the historical Sudoku
# config.  Both are recorded in the sealed manifest.

defaults:
  - config
  - _self_


parameterization: apmdm
diffusion: absorbing_state
backbone: dit


data:
  train: 'apmdm'
  valid: 'apmdm'
  tokenizer_name_or_path: 'apmdm'
  wrap: false
  streaming: false
  # Portable: resolved at run time from --data-root / APMDM_REPRO_DATA_ROOT.
  cache_dir: null
  chunk_size: 100000
  dataset_path: null
  vocab_cache_path: null
  train_ratio: 0.99


model:
  name: apmdm
  type: ddit
  vocab_size: 31       # ids 0..30; [EOS]=31 is never emitted by the generator
  length: 400          # maximum sequence length; Sudoku states are 324 tokens
  hidden_size: 256
  n_heads: 4
  n_blocks: 6
  mlp_ratio: 4         # feed-forward width 4d = 1024
  cond_dim: 128
  dropout: 0.1
  scale_by_sigma: true
  tie_word_embeddings: false


apmdm:
  lambda_remask: 1.0
  lambda_expand: 1.0
  lambda_contract: 1.0
  enable_expansion: true
  enable_contraction: true
  remasking_strategy: "threshold"
  remasking_threshold: 0.5
  expansion_strategy: "threshold"
  expansion_threshold: 0.5
  contraction_strategy: "threshold"
  contraction_threshold: 0.5
  use_precomputed_labels: true

training:
  antithetic_sampling: false
  sampling_eps: 0.001
  ema: 0

loader:
  global_batch_size: 256
  eval_global_batch_size: ${.global_batch_size}
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: true

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: bf16
  num_sanity_val_steps: 1
  max_steps: 1000000
  log_every_n_steps: 100
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 3000

checkpointing:
  save_dir: null       # portable: resolved from the run directory
  save_top_k: 1
  monitor: 'val/loss'
  every_n_train_steps: 10000

optim:
  lr: 1e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  weight_decay: 0.01


lr_scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  num_warmup_steps: 250


sampling:
  predictor: apmdm
  steps: 20
  noise_removal: false
  num_sample_batches: 2
  num_sample_log: 5
  # Frozen inference ceiling for prompt-conditioned Sudoku generation.  Derived
  # from the 100 TRAINING puzzles' symbolic trajectory lengths, never from the
  # 10,000-puzzle verdict set.  See repro/sampler.py.
  max_steps: 65536


noise:
  type: 'loglinear'


seed: 42
time_conditioning: false

eval:
  checkpoint_path: ''
  disable_ema: true
  compute_generative_perplexity: false
  generate_samples: false

wandb:
  project: 'sudoku-apmdm-paper'
  name: sudoku-paper-${now:%Y%m%d_%H%M%S}
  tags: ['apmdm', 'reasoning', 'paper-faithful']
  offline: true
  notes: 'AP-MDM paper-faithful Sudoku replication'
  group: sudoku-apmdm-paper
